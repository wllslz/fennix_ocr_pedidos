<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fennix OCR Pedidos — Editor BASE</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --ok: #22c55e;
      --err: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="file"], input[type="text"], input[type="number"] {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); margin-bottom: 12px;
    }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    button {
      background: var(--accent); color: #0f172a; border: none; border-radius: 8px;
      padding: 10px 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #334155; color: var(--text); }
    .status {
      font-size: 0.88rem; padding: 10px 12px; border-radius: 8px;
      background: #0f172a; border: 1px solid var(--border); margin-top: 10px;
      white-space: pre-wrap; word-break: break-word;
    }
    .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px; text-align: left; }
    th { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fennix OCR Pedidos</h1>
    <p class="sub">Lê prints via OCR, adiciona à aba <strong>BASE </strong> preservando XML/estilos e libera download apenas após incluir itens.</p>

    <div class="grid">
      <div class="card">
        <label for="xlsxInput">1. Planilha base (.xlsx)</label>
        <input id="xlsxInput" type="file" accept=".xlsx" />

        <label for="imgInput">2. Prints / imagens de pedidos</label>
        <input id="imgInput" type="file" accept="image/*" multiple />

        <div class="thumbs" id="thumbs"></div>
        <div class="status" id="statusBox">Aguardando seleção da planilha (.xlsx) e das imagens.</div>
      </div>

      <div class="card">
        <label for="clienteInput">Cliente</label>
        <input id="clienteInput" type="text" placeholder="Nome do cliente" />

        <div class="row">
          <div>
            <label for="pedidoInput">Nº Pedido</label>
            <input id="pedidoInput" type="text" placeholder="Ex.: 1045" />
          </div>
          <div>
            <label for="pesoInput">Peso (kg)</label>
            <input id="pesoInput" type="number" step="0.01" placeholder="0.00" />
          </div>
        </div>

        <label for="totalInput">Total (R$)</label>
        <input id="totalInput" type="number" step="0.01" placeholder="0.00" />

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="addBtn" type="button">Adicionar à BASE</button>
          <button id="downloadBtn" type="button" class="secondary" disabled>Baixar .xlsx atualizado</button>
        </div>
      </div>
    </div>

    <div class="card">
      <strong>Pedidos adicionados nesta sessão</strong>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Cliente</th>
            <th>Pedido</th>
            <th>Peso</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tabelaPedidos"></tbody>
      </table>
    </div>
  </div>

  <script>
    const TARGET_SHEET_NAME = "BASE ";
    let zipInstance = null;
    let baseSheetPath = null;
    let arquivoOriginalNome = "planilha_atualizada.xlsx";
    let pedidosAdicionados = [];
    let ocrWorker = null;

    const xlsxInput = document.getElementById("xlsxInput");
    const imgInput = document.getElementById("imgInput");
    const thumbsEl = document.getElementById("thumbs");
    const statusBox = document.getElementById("statusBox");
    const addBtn = document.getElementById("addBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const tabelaPedidos = document.getElementById("tabelaPedidos");

    function atualizarEstadoDownload() {
      downloadBtn.disabled = !(zipInstance && baseSheetPath && pedidosAdicionados.length > 0);
    }

    function setStatus(msg, isError = false) {
      statusBox.textContent = msg;
      statusBox.style.borderColor = isError ? "var(--err)" : "var(--border)";
      statusBox.style.color = isError ? "#fca5a5" : "var(--text)";
    }

    function escapeXml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function colunaParaIndice(colStr) {
      let n = 0;
      for (let i = 0; i < colStr.length; i++) {
        n = n * 26 + (colStr.charCodeAt(i) - 64);
      }
      return n;
    }

    function indiceParaColuna(num) {
      let s = "";
      while (num > 0) {
        const resto = (num - 1) % 26;
        s = String.fromCharCode(65 + resto) + s;
        num = Math.floor((num - 1) / 26);
      }
      return s;
    }

    function normalizarCaminhoZip(target) {
      const limpo = target.replace(/^\/+/, "");
      if (limpo.startsWith("xl/")) return limpo;
      return `xl/${limpo}`;
    }

    async function localizarAbaBase(zip) {
      const workbookXml = await zip.file("xl/workbook.xml")?.async("string");
      const relsXml = await zip.file("xl/_rels/workbook.xml.rels")?.async("string");
      if (!workbookXml || !relsXml) {
        throw new Error("Estrutura XML do workbook não encontrada no arquivo .xlsx.");
      }

      const parser = new DOMParser();
      const wbDoc = parser.parseFromString(workbookXml, "application/xml");
      const relsDoc = parser.parseFromString(relsXml, "application/xml");

      const sheets = Array.from(wbDoc.getElementsByTagName("sheet"));
      const abaAlvo = sheets.find((s) => s.getAttribute("name") === TARGET_SHEET_NAME);
      if (!abaAlvo) {
        throw new Error(`Aba "${TARGET_SHEET_NAME}" não foi encontrada na planilha.`);
      }

      const rId = abaAlvo.getAttribute("r:id");
      const relationships = Array.from(relsDoc.getElementsByTagName("Relationship"));
      const rel = relationships.find((r) => r.getAttribute("Id") === rId);
      if (!rel) {
        throw new Error("Relacionamento da aba BASE não encontrado em workbook.xml.rels.");
      }

      return normalizarCaminhoZip(rel.getAttribute("Target"));
    }

    xlsxInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      try {
        arquivoOriginalNome = file.name.replace(/\.xlsx$/i, "") + "_atualizado.xlsx";
        const buffer = await file.arrayBuffer();
        zipInstance = await JSZip.loadAsync(buffer);
        baseSheetPath = await localizarAbaBase(zipInstance);
        atualizarEstadoDownload();
        setStatus(`Planilha carregada. Aba alvo: ${baseSheetPath}. Adicione pelo menos 1 pedido para liberar o download.`);
      } catch (err) {
        zipInstance = null;
        baseSheetPath = null;
        atualizarEstadoDownload();
        setStatus(err.message || "Falha ao ler o arquivo .xlsx.", true);
      }
    });

    function lerImgs(files) {
      return Promise.all(
        Array.from(files).map(
          (file) =>
            new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ file, dataUrl: reader.result });
              reader.onerror = () => reject(new Error(`Erro ao ler imagem: ${file.name}`));
              reader.readAsDataURL(file);
            })
        )
      );
    }

    function preProcessarImagemCanvas(dataUrl, scale = 2.5) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imageData.data;
          const contrast = 1.45;
          const intercept = 128 * (1 - contrast);

          for (let i = 0; i < d.length; i += 4) {
            const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            const adj = Math.min(255, Math.max(0, gray * contrast + intercept));
            d[i] = adj;
            d[i + 1] = adj;
            d[i + 2] = adj;
          }
          ctx.putImageData(imageData, 0, 0);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = () => reject(new Error("Falha ao renderizar imagem no canvas."));
        img.src = dataUrl;
      });
    }

    async function obterWorkerTesseract() {
      if (ocrWorker) return ocrWorker;
      ocrWorker = await Tesseract.createWorker("por+eng", 1, {
        logger: (m) => {
          if (m.status === "recognizing text") {
            setStatus(`OCR em andamento: ${Math.round((m.progress || 0) * 100)}%...`);
          }
        }
      });
      await ocrWorker.setParameters({
        preserve_interword_spaces: "1"
      });
      return ocrWorker;
    }

    function extrairDadosPedidoDoTexto(textoBruto) {
      const limpo = textoBruto.replace(/\r/g, "\n").trim();

      const padroesPedido = [
        /(?:ped(?:ido)?|n[º°o.]*|num(?:ero)?|cod(?:igo)?|ref|#|os)\s*[:#\-–.]*\s*([A-Z0-9]{2,15})/i,
        /\b(\d{4,12})\b/
      ];

      let pedido = "";
      for (const rx of padroesPedido) {
        const m = limpo.match(rx);
        if (m && m[1]) {
          pedido = m[1].trim();
          break;
        }
      }

      const clienteMatch = limpo.match(/(?:cliente|nome|destinat[aá]rio|raz[aã]o)\s*[:\-–]\s*([^\n]{2,60})/i);
      const cliente = clienteMatch ? clienteMatch[1].trim() : "";

      const pesoMatch = limpo.match(/(?:peso|kg)\s*[:\-–]?\s*(\d+(?:[.,]\d+)?)/i);
      const peso = pesoMatch ? pesoMatch[1].replace(",", ".") : "";

      const totalMatch = limpo.match(/(?:total|valor|r\$)\s*[:\-–]?\s*(\d+(?:[.,]\d{1,2})?)/i);
      const total = totalMatch ? totalMatch[1].replace(",", ".") : "";

      return { cliente, pedido, peso, total, textoBruto: limpo };
    }

    async function processarPrint(itemImg) {
      const preparedDataUrl = await preProcessarImagemCanvas(itemImg.dataUrl, 2.5);
      const worker = await obterWorkerTesseract();
      const { data } = await worker.recognize(preparedDataUrl);
      const extraido = extrairDadosPedidoDoTexto(data.text || "");

      if (!extraido.pedido) {
        const fallbackNome = itemImg.file.name.replace(/\.[^/.]+$/, "");
        return {
          ...extraido,
          pedido: fallbackNome,
          aviso: `OCR não isolou o número do pedido em "${itemImg.file.name}"; preenchido rascunho "${fallbackNome}" para conferência.`
        };
      }

      return { ...extraido, aviso: "" };
    }

    function render() {
      tabelaPedidos.innerHTML = "";
      pedidosAdicionados.forEach((item, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${escapeXml(item.cliente)}</td>
          <td>${escapeXml(item.pedido)}</td>
          <td>${escapeXml(item.peso)}</td>
          <td>${escapeXml(item.total)}</td>
        `;
        tabelaPedidos.appendChild(tr);
      });
      atualizarEstadoDownload();
    }

    imgInput.addEventListener("change", async (e) => {
      const files = e.target.files;
      thumbsEl.innerHTML = "";
      if (!files || files.length === 0) return;

      try {
        const imagens = await lerImgs(files);
        for (const img of imagens) {
          const el = document.createElement("img");
          el.src = img.dataUrl;
          el.alt = img.file.name;
          thumbsEl.appendChild(el);
        }

        const resultado = await processarPrint(imagens[0]);
        if (resultado.pedido) document.getElementById("pedidoInput").value = resultado.pedido;
        if (resultado.cliente) document.getElementById("clienteInput").value = resultado.cliente;
        if (resultado.peso) document.getElementById("pesoInput").value = resultado.peso;
        if (resultado.total) document.getElementById("totalInput").value = resultado.total;

        const resumoTexto = resultado.textoBruto ? `\nTexto OCR:\n${resultado.textoBruto.slice(0, 350)}` : "";
        if (resultado.aviso) {
          setStatus(`${resultado.aviso}${resumoTexto}`, true);
        } else {
          setStatus(`OCR concluído para "${imagens[0].file.name}" (Pedido: ${resultado.pedido}).${resumoTexto}`);
        }
      } catch (err) {
        setStatus(`Erro ao ler ${files[0]?.name || "imagem"}: ${err.message || "Falha no OCR."}`, true);
      }
    });

    function criarCelulaXml(ref, valor, estiloIdx) {
      const styleAttr = estiloIdx ? ` s="${estiloIdx}"` : "";
      if (valor === "" || valor === null || valor === undefined) {
        return `<c r="${ref}"${styleAttr}/>`;
      }
      const num = Number(String(valor).replace(",", "."));
      if (!Number.isNaN(num) && String(valor).trim() !== "") {
        return `<c r="${ref}"${styleAttr}><v>${num}</v></c>`;
      }
      return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t xml:space="preserve">${escapeXml(String(valor))}</t></is></c>`;
    }

    function atualizarDimensionXml(xmlText, ultimaLinha, ultimaColIdx) {
      const dimRegex = /<dimension\b([^>]*)\/>/;
      const match = xmlText.match(dimRegex);
      if (!match) return xmlText;

      const attrs = match[1];
      const refMatch = attrs.match(/ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/);
      if (!refMatch) return xmlText;

      const startCol = refMatch[1];
      const startRow = refMatch[2];
      const maxColAtual = colunaParaIndice(refMatch[3]);
      const maxRowAtual = Number(refMatch[4]);

      const novaCol = indiceParaColuna(Math.max(maxColAtual, ultimaColIdx));
      const novaLinha = Math.max(maxRowAtual, ultimaLinha);
      const novoRef = `${startCol}${startRow}:${novaCol}${novaLinha}`;

      return xmlText.replace(dimRegex, `<dimension${attrs.replace(/ref="[^"]*"/, `ref="${novoRef}"`)}/>`);
    }

    async function adicionarNaPlanilha() {
      if (!zipInstance || !baseSheetPath) {
        setStatus("Carregue primeiro o arquivo .xlsx antes de adicionar pedidos.", true);
        return;
      }

      const cliente = document.getElementById("clienteInput").value.trim();
      const pedido = document.getElementById("pedidoInput").value.trim();
      const peso = document.getElementById("pesoInput").value.trim();
      const total = document.getElementById("totalInput").value.trim();

      if (!cliente && !pedido && !peso && !total) {
        setStatus("Preencha ao menos um campo antes de adicionar à aba BASE.", true);
        return;
      }

      try {
        let sheetXml = await zipInstance.file(baseSheetPath).async("string");
        const rowMatches = Array.from(sheetXml.matchAll(/<row\b[^>]*r="(\d+)"[^>]*>[\s\S]*?<\/row>/g));

        let proximaLinha = 2;
        let estilosReferencia = ["", "", "", ""];

        if (rowMatches.length > 0) {
          const ultimaRowMatch = rowMatches[rowMatches.length - 1];
          proximaLinha = Number(ultimaRowMatch[1]) + 1;

          const celulasUltima = Array.from(ultimaRowMatch[0].matchAll(/<c\b[^>]*\b(?:s="(\d+)")?[^>]*>/g));
          estilosReferencia = [0, 1, 2, 3].map((i) => celulasUltima[i]?.[1] || "");
        }

        const valores = [cliente, pedido, peso, total];
        const celulasXml = valores
          .map((val, idx) => criarCelulaXml(`${indiceParaColuna(idx + 1)}${proximaLinha}`, val, estilosReferencia[idx]))
          .join("");

        const novaLinhaXml = `<row r="${proximaLinha}">${celulasXml}</row>`;

        if (sheetXml.includes("</sheetData>")) {
          sheetXml = sheetXml.replace("</sheetData>", `${novaLinhaXml}</sheetData>`);
        } else {
          throw new Error("Tag </sheetData> não encontrada no XML da aba BASE.");
        }

        sheetXml = atualizarDimensionXml(sheetXml, proximaLinha, 4);
        zipInstance.file(baseSheetPath, sheetXml);

        pedidosAdicionados.push({ cliente, pedido, peso, total });
        render();

        document.getElementById("clienteInput").value = "";
        document.getElementById("pedidoInput").value = "";
        document.getElementById("pesoInput").value = "";
        document.getElementById("totalInput").value = "";

        setStatus(`Linha ${proximaLinha} adicionada à aba "${TARGET_SHEET_NAME}". Botão de download liberado.`);
      } catch (err) {
        setStatus(err.message || "Erro ao atualizar a aba BASE.", true);
      }
    }

    async function baixarPlanilha() {
      if (!zipInstance || pedidosAdicionados.length === 0) {
        setStatus("Adicione ao menos um pedido antes de baixar a planilha.", true);
        return;
      }

      try {
        const blob = await zipInstance.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = arquivoOriginalNome;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        setStatus(`Download iniciado: ${arquivoOriginalNome}`);
      } catch (err) {
        setStatus(err.message || "Erro ao gerar o arquivo .xlsx para download.", true);
      }
    }

    addBtn.addEventListener("click", adicionarNaPlanilha);
    downloadBtn.addEventListener("click", baixarPlanilha);
    atualizarEstadoDownload();
  </script>
</body>
</html>
